<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levezza — Obrigada!</title>
<style>
body{margin:0;background:#fffbe8;font-family:Arial,sans-serif;color:#c5162e;text-align:center}
.wrap{max-width:520px;margin:auto;padding:42px 22px}
.card{background:white;border-radius:24px;padding:30px;box-shadow:0 8px 30px #0001}
.logo{font-size:44px;font-weight:800;margin-bottom:8px}

button{border:0;border-radius:999px;padding:14px 24px;background:#c5162e;color:white;font-size:16px;cursor:pointer}

</style>
</head>
<body>
<div class="wrap"><div class="card">

<div style="font-size:58px">🍰</div>

<p class="sub">Esta é uma página demonstrativa da Levezza. Seu pedido não é real.</p>
<button onclick="document.getElementById('msg').style.display='block'">Conhecer a surpresa</button>
<p id="msg">✨ Você ganhou um sorriso e um docinho imaginário!</p>
</div></div>
